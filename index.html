<!DOCTYPE html><html lang="id"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Koperasi SMK Muthia Harapan Cicalengka</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #263238;

        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-container {
        width: 100%;
        padding: 20px;
    }

    .login-card {
        max-width: 400px;
        margin: auto;
        padding: 40px 35px;

        background: #ffffff;
        border-radius: 14px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .login-card h1 {
        text-align: center;
        margin-bottom: 8px;

        font-size: 30px;
        color: #0f2747;
    }

    .subtitle {
        text-align: center;
        color: #78909c;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;

        font-size: 14px;
        font-weight: bold;
        color: #37474f;
    }

    .input-group input {
        width: 100%;
        padding: 13px 14px;

        border: 1px solid #d6dce1;
        border-radius: 8px;

        font-size: 15px;
        outline: none;

        transition: 0.2s;
    }

    .input-group input:focus {
        border-color: #0f2747;
        box-shadow: 0 0 0 3px rgba(15, 39, 71, 0.08);
    }

    .login-card button {
        width: 100%;
        padding: 13px;

        border: none;
        border-radius: 8px;

        background: #0f2747;
        color: white;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;
        transition: 0.2s;
    }

    .login-card button:hover {
        background: #183b68;
        transform: translateY(-1px);
    }

    #errorMessage {
        min-height: 20px;
        margin-top: 12px;

        text-align: center;
        font-size: 13px;
        color: #d32f2f;
    }

    .kembali {
        display: block;
        margin-top: 25px;

        text-align: center;
        text-decoration: none;

        color: #607d8b;
        font-size: 14px;

        transition: 0.2s;
    }

    .kembali:hover {
        color: #0f2747;
    }
</style>

</head><body><div class="login-container">

    <div class="login-card">

        <h1>Login</h1>

        <p class="subtitle">
            Koperasi SMK Muthia Harapan Cicalengka
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

            <p id="errorMessage"></p>

        </form>

        <a href="index.html" class="kembali">
            ← Kembali ke Beranda
        </a>

    </div>

</div>

<script>

    const usernameBenar = "admin";
    const passwordBenar = "12345";

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("errorMessage");

        if (username === usernameBenar && password === passwordBenar) {

            window.location.href = "Koperasi.html";

        } else {

            errorMessage.textContent = "Username atau password salah!";

        }

    });

</script>

</body></html>
